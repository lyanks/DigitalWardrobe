{# One trip in the list: name, dates, and how full the suitcase is. #}
<a href="{{ url_for('trips.pack', trip_id=trip.id) }}" class="trip-row">
  <span class="trip-row-name">{{ trip.name }}</span>
  <span class="muted">{{ trip | trip_dates }}</span>
  <span class="trip-row-count">
    {% set total = trip.item_links | length %}
    {% if total %}{{ trip.packed_count }} of {{ total }} packed{% else %}Empty suitcase{% endif %}
  </span>
</a>
